<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one wide instrument table under a compact header; rows expand into plan sheets */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #17202e; --muted: #5d6b80; --line: #dde3ec;
  --accent: #1f5fd1; --hot: #e5262b; --good: #188a4f; --warn: #b7791f; --bad: #c2333a;
  --head: #e9edf3;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --panel: #161d28; --fg: #e4e9f1; --muted: #93a1b5; --line: #263142;
  --accent: #6c9cff; --hot: #ff4b4f; --good: #41c47f; --warn: #e0a64a; --bad: #ff6b70;
  --head: #1c2532; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --panel: #161d28; --fg: #e4e9f1; --muted: #93a1b5; --line: #263142;
  --accent: #6c9cff; --hot: #ff4b4f; --good: #41c47f; --warn: #e0a64a; --bad: #ff6b70;
  --head: #1c2532; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px;
        display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
h1 { font: 800 clamp(26px, 4vw, 38px)/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em;
     text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 75ch; }
.sub a { color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controls input[type=search] { font: inherit; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; width: 240px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.count { margin-left: auto; color: var(--muted); font: 12px var(--f-mono); }

.tablebox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--head); z-index: 2; font-weight: 600;
  font-size: 12px; vertical-align: bottom; line-height: 1.25; }
thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
thead th .unit { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
thead th .arrow { color: var(--accent); width: 0.8em; display: inline-block; }
thead tr.groups th { background: var(--panel); color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; text-align: center; border-bottom: 2px solid var(--line); position: static; }
th.gs, td.gs { border-left: 1px solid var(--line); }

tbody tr.p { cursor: pointer; }
tbody tr.p:hover td { background: color-mix(in oklab, var(--accent) 6%, transparent); }
tbody tr.p:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
td.name { font-weight: 600; }
td.name small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
td.num { font-family: var(--f-mono); font-size: 13px; }
td.na { color: var(--muted); }
.stale { color: var(--warn); }
.speed { position: relative; }
.pill { display: inline-block; min-width: 3.6em; padding: 1px 6px; border-radius: 4px; text-align: right; }
.lat-g { color: var(--good); } .lat-m { color: var(--warn); } .lat-b { color: var(--bad); }
.okbar { display: inline-block; vertical-align: middle; width: 44px; height: 5px; border-radius: 3px;
  background: var(--line); margin-left: 6px; overflow: hidden; }
.okbar i { display: block; height: 100%; background: var(--good); }
.best { color: var(--accent); font-weight: 600; }

tr.detail td { background: var(--bg); text-align: left; white-space: normal; padding: 14px 16px 18px; }
.detail-grid { display: grid; gap: 10px; }
.detail-links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.detail-links a { color: var(--accent); }
table.plans { width: auto; min-width: 0; font-size: 13px; background: var(--panel); border: 1px solid var(--line); }
table.plans th { background: var(--head); position: static; font-size: 11.5px; }
table.plans td.line { text-align: left; color: var(--muted); white-space: normal; max-width: 60ch; font-size: 12px; }

section.notes { display: grid; gap: 6px; max-width: 90ch; color: var(--muted); font-size: 13px; }
section.notes h2 { font: 600 16px var(--f-display); color: var(--fg); margin: 0; }
section.notes dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
section.notes dt { color: var(--fg); font-weight: 600; }
section.notes dd { margin: 0; }
@media (max-width: 640px) { section.notes dl { grid-template-columns: 1fr; } section.notes dd { margin-bottom: 6px; } }
@media (prefers-reduced-motion: no-preference) { tbody tr.p td { transition: background 0.12s; } }
</style>

<div class="wrap">
  <header>
    <h1>DuyaoSS airport board</h1>
    <p class="sub">Every provider on <a href="https://www.duyaoss.com/archives/3/">DuyaoSS 机场测速 (联通)</a>,
      read from its MiaoKo result image (天津联通, single thread, 1000M) and its 套餐 text.
      Click a column to sort and click a row for its plans.</p>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Filter by name or route" aria-label="Filter providers">
    <label><input type="checkbox" id="priced"> Only with plan prices</label>
    <label><input type="checkbox" id="fresh"> Hide tests older than 120 days</label>
    <span class="count" id="count"></span>
  </div>

  <div class="tablebox">
    <table id="t">
      <thead>
        <tr class="groups">
          <th colspan="2"></th>
          <th colspan="3" class="gs">Nodes</th>
          <th colspan="3" class="gs">Speed · 平均速度</th>
          <th colspan="3" class="gs">Latency · HTTPS延迟</th>
          <th colspan="3" class="gs">Price · 套餐</th>
        </tr>
        <tr id="hdr"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <section class="notes">
    <h2>How the numbers are made</h2>
    <dl id="defs"></dl>
  </section>
</div>

  {k: "ok", t: "Success", u: "%", cell: p => `<td class="num">${fmt(p.ok)}%<span class="okbar"><i style="width:${p.ok || 0}%"></i></span></td>`,
   d: "Working ÷ nodes."},
  {k: "speed", t: "Average", u: "MB/s", g: 1, dec: 2, cell: p => `<td class="num gs"><span class="pill" style="${heat(p.speed)}">${fmt(p.speed, 2)}</span></td>`,
   d: "Mean 平均速度 of working nodes, in MB/s as MiaoKo prints it."},
  {k: "speed_med", t: "Median", u: "MB/s", dec: 2, d: "Median 平均速度 of working nodes; less pulled around by a few very fast or slow nodes."},
  {k: "fast", t: "Fast", u: `≥ ${DATA.fast} MB/s`, d: `Nodes averaging at least ${DATA.fast} MB/s (about 250 Mbps).`},
  {k: "ms", t: "Average", u: "ms", g: 1, asc: true, cell: p => `<td class="num gs ${latClass(p.ms)}">${fmt(p.ms)}</td>`,
   d: "Mean HTTPS延迟 over nodes that returned one. Lower is better."},
  {k: "ms_med", t: "Median", u: "ms", asc: true, cell: p => `<td class="num ${latClass(p.ms_med)}">${fmt(p.ms_med)}</td>`, d: "Median HTTPS延迟."},
  {k: "snappy", t: "Snappy", u: `< ${DATA.snappy} ms`, d: `Nodes with HTTPS延迟 under ${DATA.snappy} ms.`},
  {k: "price", t: "From", u: "元 / year", g: 1, asc: true, dec: 0,
   cell: p => `<td class="num gs" title="${esc(p.price_plan || "")}">${fmt(p.price, p.price % 1 ? 2 : 0)}</td>`,
   d: "Cheapest plan per year: its 1-year price, or its longest shorter period scaled to 12 months."},
  {k: "price_v", t: "Its value", u: "GB / 100元", dec: 0, d: "GB per 100 元 of that cheapest plan."},
  {k: "best_v", t: "Best value", u: "GB / 100元", dec: 0,
   cell: p => `<td class="num best" title="${esc(p.best_plan || "")}">${fmt(p.best_v)}</td>`,
   d: "The provider's plan with the most traffic per 100 元 (hover for the plan name)."},
];

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

let sortKey = "best_v", sortAsc = false, open = new Set();

const hdr = document.getElementById("hdr");
hdr.innerHTML = COLS.map(c => `<th class="${c.g ? "gs" : ""}" ${c.d ? `title="${esc(c.d)}"` : ""}>
  <button data-k="${c.k}">${c.t}<span class="arrow"></span></button>${c.u ? `<span class="unit">${esc(c.u)}</span>` : ""}</th>`).join("");
hdr.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const c = COLS.find(c => c.k === b.dataset.k);
  if (sortKey === c.k) sortAsc = !sortAsc; else { sortKey = c.k; sortAsc = !!c.asc; }
  render();
});

document.getElementById("defs").innerHTML = COLS.filter(c => c.d).map(c =>
  `<dt>${c.t}${c.u ? " (" + esc(c.u) + ")" : ""}</dt><dd>${esc(c.d)}</dd>`).join("") +
  `<dt>Plans</dt><dd>Parsed from each provider's 套餐 lines. 不限时 plans have no yearly price; their value is total GB ÷ price. Three source typos are corrected (FlyingBird 144年/月, ssrcloud 元.月, 猫熊 专线50G 每月500G).</dd>`;

["q", "priced", "fresh"].forEach(id => document.getElementById(id).addEventListener("input", render));

const body = document.getElementById("body");
body.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const tr = e.target.closest("tr.p"); if (!tr) return;
  toggle(tr.dataset.n);
});
body.addEventListener("keydown", e => {
  const tr = e.target.closest("tr.p");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tr.dataset.n); }
});
function toggle(n) { open.has(n) ? open.delete(n) : open.add(n); render(); }

function detail(p) {
  const plans = p.plans.length ? `<table class="plans"><thead><tr>
      <th>Plan</th><th>元 / year</th><th>GB / year</th><th>GB / 100元</th><th>Basis</th><th>Source text</th></tr></thead><tbody>` +
    p.plans.map(x => `<tr><td>${esc(x.plan)}</td><td class="num">${fmt(x.price, x.price % 1 ? 2 : 0)}</td>
      <td class="num">${fmt(x.gb)}</td><td class="num ${x.v === p.best_v ? "best" : ""}">${fmt(x.v)}</td>
      <td>${esc(x.basis)}</td><td class="line">${esc(x.line)}</td></tr>`).join("") + `</tbody></table>`
    : `<p>No plan text on the page for this provider.</p>`;
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="detail-grid">
    <div class="detail-links">${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">Website</a>` : ""}
      <a href="${esc(p.image)}" target="_blank" rel="noopener">Speedtest image</a>
      <span>${p.working} of ${p.nodes} nodes working · ${p.fast} fast · ${p.snappy} snappy</span></div>
    <div class="tablebox">${plans}</div></div></td></tr>`;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const priced = document.getElementById("priced").checked;
  const fresh = document.getElementById("fresh").checked;
  const col = COLS.find(c => c.k === sortKey);
  const key = col.sort || (p => p[col.k]);
  const list = P.filter(p => (!q || (p.name + p.kind).toLowerCase().includes(q))
      && (!priced || p.price != null) && (!fresh || ageDays(p.tested) <= STALE_DAYS))
    .sort((a, b) => {
      const x = key(a), y = key(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1; if (y == null) return -1;    // missing values always last
      return (x < y ? -1 : x > y ? 1 : 0) * (sortAsc ? 1 : -1);
    });
  hdr.querySelectorAll("button").forEach(b =>
    b.querySelector(".arrow").textContent = b.dataset.k === sortKey ? (sortAsc ? "▲" : "▼") : "");
  body.innerHTML = list.map(p => {
    const row = `<tr class="p" tabindex="0" data-n="${esc(p.name)}" aria-expanded="${open.has(p.name)}">` + COLS.map(c =>
      c.cell ? c.cell(p) : `<td class="num ${c.g ? "gs" : ""} ${p[c.k] == null ? "na" : ""}">${fmt(p[c.k], c.dec || 0)}</td>`).join("") + `</tr>`;
    return open.has(p.name) ? row + detail(p) : row;
  }).join("");
  document.getElementById("count").textContent = `${list.length} of ${P.length} providers`;
}
render();
</script>
